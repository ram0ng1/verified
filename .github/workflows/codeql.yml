name: CodeQL

# 🟠 I2 — Análise estática para JS/TS (XSS, prototype pollution, path traversal,
# command injection). PHP NÃO é suportado pelo CodeQL; para backend use
# Semgrep (regras p/php + p/security-audit) ou PHPStan (já configurado em ci.yml).

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Semanalmente, segunda-feira 06:00 UTC.
    - cron: '0 6 * * 1'

# 🔴 C1 — Default-deny.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6825d5659bf007b85a0866e2d0f434aacf50de94 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Análise CodeQL
        uses: github/codeql-action/analyze@6825d5659bf007b85a0866e2d0f434aacf50de94 # v3.27.5
        with:
          category: '/language:${{ matrix.language }}'
