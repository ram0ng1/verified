name: CodeQL

# 🟠 I2 — Análise estática para JS/TS (XSS, prototype pollution, path traversal,
# command injection). PHP NÃO é suportado pelo CodeQL; para backend use
# Semgrep (regras p/php + p/security-audit) ou PHPStan (já configurado em ci.yml).

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Semanalmente, segunda-feira 06:00 UTC.
    - cron: '0 6 * * 1'

# 🔴 C1 — Default-deny.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    # Desliga a otimização "diff-informed queries" do CodeQL.
    # Em v3.27/3.28 ela falha quando o `pr-diff-range.yml` recebe paths/linhas
    # como "undefined" (PRs sem base compartilhada, fetch raso, primeiro commit
    # da branch). Mantemos `false` aqui até promover para uma versão que cubra
    # esse caso de borda sem erro fatal.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Histórico suficiente para o CodeQL diferenciar base vs head em PRs.
          fetch-depth: 0

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Análise CodeQL
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:${{ matrix.language }}'
