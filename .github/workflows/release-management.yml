name: Release Workflow

on:
  push:
    branches:
      - main

# 🔴 C1 — Default-deny no nível do workflow; o job re-concede o necessário.
permissions: {}

# 🟠 I4 — Serializa execuções (não cancela em andamento — cancelar mid-release
# deixaria tag meio-publicada).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build e Publicação Automática
    runs-on: ubuntu-latest
    permissions:
      contents: write          # criar release + tag
      pull-requests: read      # release-drafter lê PRs mergeados
      id-token: write          # 🟡 R4 — exigido por attest-build-provenance
      attestations: write      # 🟡 R4 — escrita do attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar Dependências JS
        run: |
          cd js
          npm ci

      - name: Build JS (Flarum)
        run: |
          cd js
          npm run build

      - name: Verificar versão no composer.json
        id: check_version
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 # v3.0.0
        with:
          file-name: composer.json
          diff-search: true

      - name: Publicar Release em Português
        id: create_release
        if: steps.check_version.outputs.changed == 'true'
        uses: release-drafter/release-drafter@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        with:
          publish: true
          tag: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🟡 R4 — SLSA provenance attestation para os artefatos publicados.
      # Roda apenas quando release foi publicada nesta execução.
      - name: Atestar provenance dos artefatos
        if: steps.check_version.outputs.changed == 'true' && steps.create_release.outcome == 'success'
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: 'composer.json,js/dist/forum.js,js/dist/admin.js'

      - name: Publicar Release no Flarum
        if: steps.check_version.outputs.changed == 'true' && steps.create_release.outcome == 'success' && steps.create_release.outputs.html_url && vars.FLARUM_DISCUSSION_ID != ''
        env:
          FLARUM_API_KEY: ${{ secrets.FLARUM_API_KEY }}
          FLARUM_DISCUSSION_ID: ${{ vars.FLARUM_DISCUSSION_ID }}
          RELEASE_TAG: ${{ steps.create_release.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.create_release.outputs.body }}
          RELEASE_URL: ${{ steps.create_release.outputs.html_url }}
        run: |
          # Extract version from tag (remove leading 'v' if present)
          VERSION="${RELEASE_TAG#v}"

          PAYLOAD=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            --arg version "$VERSION" \
            --arg discussion_id "$FLARUM_DISCUSSION_ID" \
            '{
              "data": {
                "type": "posts",
                "attributes": {
                  "content": ("## 🚀 " + $tag + "\n\n" + $body + "\n\n**Instalação:**\n```\ncomposer require ramon/verified:" + $version + "\n```\n\n[Ver release no GitHub](" + $url + ")")
                },
                "relationships": {
                  "discussion": {
                    "data": {
                      "type": "discussions",
                      "id": $discussion_id
                    }
                  }
                }
              }
            }')

          HTTP_STATUS=$(curl -s -o /tmp/flarum_response.json -w "%{http_code}" \
            -X POST "https://ramonguilherme.com.br/api/posts" \
            -H "Authorization: Token ${FLARUM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Comentário publicado com sucesso no Flarum!"
            echo "Post ID: $(jq -r '.data.id // empty' /tmp/flarum_response.json)"
          else
            echo "❌ Falha ao publicar comentário no Flarum (HTTP $HTTP_STATUS)"
            echo "Response body:"
            jq '.' /tmp/flarum_response.json
            exit 1
          fi

      - name: Log de Status
        run: |
          echo "Versão alterada: ${{ steps.check_version.outputs.changed }}"
          echo "Nova versão: ${{ steps.check_version.outputs.version }}"
