name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Segunda 05:00 UTC: roda a CI mesmo sem push. Como os jobs resolvem as
  # dependências com `composer update`, o agendamento testa automaticamente
  # contra a versão mais nova do flarum/core e detecta quebras trazidas por
  # novas versões do Flarum antes que cheguem a você.
  schedule:
    - cron: '0 5 * * 1'

# Avoid stacking redundant runs for the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔴 C1 — Top-level default-deny. Each job re-grants only what it needs.
permissions: {}

jobs:
  # 🔴 PHP lint matrix.
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      # 🟠 I3 — Harden-runner first step. Audit-only initially; promote to
      # `egress-policy: block` after two weeks of clean audit logs.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # O composer.json NÃO tem mais campo "version" — a versão é derivada
        # da última tag git no workflow de release. Sem o campo, o
        # `composer validate --strict` já não emite o aviso "version field is
        # present", então `--no-check-version` foi removido. `--no-check-publish`
        # permanece (a extensão é uma lib, não é publicada como pacote final).
        run: composer validate --strict --no-check-publish

      # 🟡 R2 — composer audit contra a base do Packagist.
      # Não falha o build inicialmente (continue-on-error) — promova depois.
      - name: composer audit
        run: composer audit --no-dev --format=plain
        continue-on-error: true

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

  # 🟡 R3 — PHPStan com matriz × Flarum core (🟠 I5).
  # Detecta regressões de tipo contra `^2.0.0-rc.1` (stable) e `2.x-dev`.
  phpstan:
    name: PHPStan / core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flarum-core: ['^2.0.0-rc.1', '2.x-dev']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Selecionar versão alvo do Flarum core
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Instalar dependências
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable

      # §35.13 R3 — nível 6 com baseline versionado (phpstan.neon +
      # phpstan-baseline.neon). BLOQUEANTE: o baseline mantém verde e novos
      # achados reprovam o PR (aperte o nível/baseline com o tempo).
      - name: PHPStan analyse
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  # 🔴 JS build + 🟡 npm audit.
  js:
    name: JS (typecheck, format, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Setup PHP + composer for the Flarum core typings. The js/tsconfig
      # resolves `flarum/*` imports through `../vendor/flarum/core/js/dist-typings/*`,
      # so without composer install the type-check fails with TS2307.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependências PHP (para os typings do core)
        # `composer update` (em vez de install) porque a extensão é uma
        # lib e mantém composer.lock no .gitignore.
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar dependências JS
        working-directory: js
        run: npm ci

      # 🟡 R2 — npm audit (só alta severidade pra reduzir ruído).
      - name: npm audit
        working-directory: js
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verificar formatação (Prettier)
        working-directory: js
        run: npm run format-check

      - name: Type-check (TypeScript)
        working-directory: js
        run: npm run check-typings

      - name: Build (webpack production)
        working-directory: js
        run: npm run build

  # 🟠 I1 — Bloqueia PRs que introduzem deps com CVE conhecido (composer/npm).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
