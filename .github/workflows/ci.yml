name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Avoid stacking redundant runs for the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔴 C1 — Top-level default-deny. Each job re-grants only what it needs.
permissions: {}

jobs:
  # 🔴 PHP lint matrix.
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      # 🟠 I3 — Harden-runner first step. Audit-only initially; promote to
      # `egress-policy: block` after two weeks of clean audit logs.
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # `--no-check-version` silencia o aviso "version field is present" —
        # mantemos o campo de propósito (lido pelo EndBug/version-check no
        # workflow de release). Todos os outros warnings continuam fatais.
        run: composer validate --strict --no-check-publish --no-check-version

      # 🟡 R2 — composer audit contra a base do Packagist.
      # Não falha o build inicialmente (continue-on-error) — promova depois.
      - name: composer audit
        run: composer audit --no-dev --format=plain
        continue-on-error: true

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

  # 🟡 R3 — PHPStan com matriz × Flarum core (🟠 I5).
  # Detecta regressões de tipo contra `^2.0.0-rc.1` (stable) e `2.x-dev`.
  phpstan:
    name: PHPStan / core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flarum-core: ['^2.0.0-rc.1', '2.x-dev']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, phpstan

      - name: Selecionar versão alvo do Flarum core
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Instalar dependências
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable

      # Nível 5 como baseline; promova para `max` depois de limpar a base.
      # `continue-on-error` mantém o resultado informativo até a primeira
      # passagem limpa — depois disso, troque para falhar.
      - name: PHPStan analyse
        run: phpstan analyse src extend.php --level=5 --no-progress --memory-limit=1G --error-format=github
        continue-on-error: true

  # 🔴 JS build + 🟡 npm audit.
  js:
    name: JS (typecheck, format, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Setup PHP + composer for the Flarum core typings. The js/tsconfig
      # resolves `flarum/*` imports through `../vendor/flarum/core/js/dist-typings/*`,
      # so without composer install the type-check fails with TS2307.
      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependências PHP (para os typings do core)
        # `composer update` (em vez de install) porque a extensão é uma
        # lib e mantém composer.lock no .gitignore.
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar dependências JS
        working-directory: js
        run: npm ci

      # 🟡 R2 — npm audit (só alta severidade pra reduzir ruído).
      - name: npm audit
        working-directory: js
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verificar formatação (Prettier)
        working-directory: js
        run: npm run format-check

      - name: Type-check (TypeScript)
        working-directory: js
        run: npm run check-typings

      - name: Build (webpack production)
        working-directory: js
        run: npm run build

  # 🟠 I1 — Bloqueia PRs que introduzem deps com CVE conhecido (composer/npm).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
